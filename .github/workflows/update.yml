name: 공지 갱신

on:
  schedule:
    # 매시 정각 (UTC 기준이지만 매시간이라 상관없음)
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scrape.py
      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/notices.json docs/notices.js
          # 갱신 시각만 바뀐 경우에도 커밋해 '마지막 갱신'이 정확히 보이도록 한다
          git diff --cached --quiet || git commit -m "공지 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
